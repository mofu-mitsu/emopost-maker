<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GNTX973GET"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GNTX973GET');

    <title>今夜のエモポストメーカー 🌙✨</title>
    <link rel="icon" type="image/x-icon" href="https://emopost-maker.pages.dev/emopost-maker/favicon.ico">
    <meta name="description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:title" content="今夜のエモポストメーカー 🌙✨">
    <meta property="og:description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:image" content="https://emopost-maker.pages.dev/emopost-ogp.png">
    <meta property="og:url" content="https://emopost-maker.pages.dev/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;min-height:100vh;overflow-y:auto !important;overscroll-behavior-y:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}
        body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#f5e6ff;color:#555;text-align:center;padding:2em 1em;display:flex;flex-direction:column;align-items:center}
        @media(min-width:768px){body{background:linear-gradient(270deg,#e6f3ff,#f0e6ff,#ffe6f8);background-size:600% 600%;animation:g 25s ease infinite}}
        @keyframes g{0%{background-position:0%50%}50%{background-position:100%50%}100%{background-position:0%50%}}
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
        .e{position:absolute;animation:f 12s linear infinite;opacity:0.7;font-size:1.5em}
        @keyframes f{0%{transform:translateY(100vh)}100%{transform:translateY(-100px)}}
        h1{font-size:2.4em;background:#fff;padding:.6em 1.2em;border:4px dotted #c0c0ff;border-radius:2em;box-shadow:0 6px 15px #e6e6fa;margin-bottom:.5em}
        .g{background:linear-gradient(45deg,#87ceeb,#dda0dd,#ffb6c1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .c{max-width:500px;width:100%;margin:1em auto}
        .i{background:#fff;border-radius:1.5em;padding:2em;box-shadow:0 8px 20px #d8bfd8}
        input{width:100%;padding:1em;font-size:1.1em;border:2px solid #dda0dd;border-radius:1em;background:#fff8ff}
        
        .b{background:linear-gradient(to right,#e6e6fa,#dda0dd);border:none;color:#fff;font-weight:bold;padding:1em 2em;border-radius:2em;cursor:pointer;font-size:1.1em;margin:1em 0;box-shadow:0 6px 15px #dda0dd55; width: 100%;}
        .b:hover{transform:translateY(-2px)}
        .b-local{background:linear-gradient(to right,#d3d3d3,#a9a9a9); font-size:0.9em; margin-top: 0.5em; padding:0.8em 1.5em; box-shadow:0 4px 10px #aaaaaa55;}
        
        #r{background:#f0f8ff;border:3px dashed #b0c4de;border-radius:2em;padding:2em;position:relative;box-shadow:0 8px 20px #e6e6fa;margin:2em 0}
        .copy{position:absolute;top:10px;right:10px;font-size:1.8em;cursor:pointer;background:#fff;padding:8px;border-radius:50%;box-shadow:0 2px 8px #ccc;z-index:10}
        .s{border:6px solid #f3f3f3;border-top:6px solid #dda0dd;border-radius:50%;width:60px;height:60px;animation:s 1s linear infinite;margin:2em auto}
        @keyframes s{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .btns{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin:3em 0}
        .btns button{width: auto;}
        .savehint{background:#fff8ff;padding:1.5em;border-radius:2em;margin:2em 0;box-shadow:0 8px 25px #dda0dd55;color:#d670d6;font-weight:bold}
        footer{margin-top:auto;padding:2em;background:#f0f8ff;width:100%;border-top:3px dashed #dda0dd}
    </style>
</head>
<body>
    <div class="particles" id="p"></div>
    <h1><span class="g">今夜のエモポストメーカー 🌙✨</span></h1>
    <p class="c">今日の気分やキーワードを入れてね♡</p>

    <!-- メインフォーム（最初はここだけ表示！） -->
    <div id="form" class="c i">
        <input type="text" id="kw" placeholder="例：幸せ、夜空">
        <button id="gen-server" class="b">サクッとAI生成！♡（おすすめ）</button>
        <button id="gen-local" class="b b-local">端末の力で生成⚡️（※初回読込長め）</button>
    </div>
    
    <!-- ローディング画面 -->
    <div id="ing" class="c" style="display:none">
        <div class="s"></div>
        <p id="ing-text">全力で紡いでるよ…♡</p>
        <p id="prog" style="font-size:0.9em; color:#999; margin-top:0.5em;"></p>
    </div>

    <!-- 保存対象エリア -->
    <div id="saveArea" style="display:none;padding:20px 10px;background:rgba(255,255,255,0.9);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)">
        <div id="purePoemArea" class="c" style="background:#f0f8ff;border:3px dashed #b0c4de;border-radius:2em;padding:2em;position:relative;box-shadow:0 8px 20px #e6e6fa">
            <h2 style="margin-bottom:1em">🌙今夜の夢ポエム♡</h2>
            <p id="poem" style="white-space:pre-line;font-size:1.5em;line-height:2.2;padding:2em;background:rgba(255,255,255,0.85);border-radius:2em;box-shadow:0 8px 25px rgba(0,0,0,0.1);margin:0"></p>
        </div>
    </div>

    <!-- 表示用エリア -->
    <div id="displayArea" style="display:none" class="c">
        <div id="r" style="background:#f0f8ff;border:3px dashed #b0c4de;border-radius:2em;padding:2em;position:relative;box-shadow:0 8px 20px #e6e6fa;margin:2em 0">
            <span class="copy" onclick="copy()">📋</span>
            <h2 style="margin-bottom:1em">🌙今夜の夢ポエム♡</h2>
            <p id="poemDisplay" style="white-space:pre-line;font-size:1.5em;line-height:2.2;padding:2em;background:rgba(255,255,255,0.85);border-radius:2em;box-shadow:0 8px 25px rgba(0,0,0,0.1)"></p>
            <div class="savehint">
                💡 スマホの方は画像保存ボタンを押して長押し → 「画像を保存」してね♡<br>
            </div>
        </div>
        
        <!-- 広告 -->
        <div id="adArea" style="margin:3em 0 2em;text-align:center">
            <p style="font-size:0.95em;color:#d670d6;margin-bottom:0.8em">ポエム後はおせちで癒し♪</p>
            <a href="https://hb.afl.rakuten.co.jp/hsc/4e336792.7c0b3872.3d95c766.8a7897b5/?link_type=pict&ut=eyJwYWdlIjoic2hvcCIsInR5cGUiOiJwaWN0IiwiY29sIjoxLCJjYXQiOiI1OCIsImJhbiI6MzIzMDk1MCwiYW1wIjpmYWxzZX0%3D" target="_blank" rel="nofollow sponsored noopener">
                <img src="https://hbb.afl.rakuten.co.jp/hsb/4e336792.7c0b3872.3d95c766.8a7897b5/?me_id=1&me_adv_id=3230950&t=pict" border="0" style="max-width:100%;height:auto;border-radius:12px;box-shadow:0 6px 20px rgba(221,160,221,0.4)" alt="楽天おせち2026 最大350円OFF！">
            </a>
        </div>
    </div>

    <div class="btns" id="btns" style="display:none">
        <button class="b" onclick="retry()">もう一度！♡</button>
        <button class="b" onclick="saveAsImage()">画像保存📸</button>
        <button class="b" onclick="share()">共有</button>
    </div>

    <footer><a href="https://mofu-mitsu.github.io/" style="color:#9370db;font-weight:bold">TOPへ戻る</a></footer>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <!-- Web-LLM用のスクリプト（※みつきの環境に合わせてパスを調整してね） -->
    <script type="module" src="./web-tokenizers.js"></script>
    <script type="module" src="./web-llm.js"></script>

    <script type="module">
        import { CreateMLCEngine } from "./web-llm.js";
        
        let engine = null;
        const model = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyp4xfJZkR0_1YFwCkmiyuYVK2r7UukIubOL8J91fTqC1_W3bUYHFkMz-gmdZLJtPUu/exec";

        // ポエム表示処理（共通）
        function showPoem(poemText) {
            document.getElementById("ing").style.display = "none";
            document.getElementById("saveArea").style.display = "block";    
            document.getElementById("displayArea").style.display = "block"; 
            
            document.getElementById("poem").textContent = poemText;
            document.getElementById("poemDisplay").textContent = poemText;
            
            document.getElementById("btns").style.display = "flex";
        }

        // ① サーバー通信（GAS経由）で生成する関数
        document.getElementById("gen-server").onclick = async () => {
            const kw = document.getElementById("kw").value.trim() || "夜空";
            document.getElementById("form").style.display = "none";
            document.getElementById("ing").style.display = "block";
            document.getElementById("ing-text").textContent = "サーバーAIに繋がり中…♡";
            document.getElementById("prog").textContent = "";

            let poem = "";
            try {
                // 💡 JSからGASへ通信する時、CORSエラーを回避するために 'text/plain' で送る裏ワザだよ！
                const res = await fetch(GAS_URL, { 
                    method: "POST",
                    headers: {"Content-Type": "text/plain"}, 
                    body: JSON.stringify({keyword: kw})
                });
                const data = await res.json();
                poem = data.poem || "えへへ〜♡ ごめんね、ちょっとAIの調子が悪いの…♡";
            } catch(e) {
                console.error(e);
                poem = "えへへ〜♡ ごめんね、通信エラーになっちゃったみたい…♡";
            }
            showPoem(poem);
        };

        // ② Web-LLM（ローカル）で生成する関数
        document.getElementById("gen-local").onclick = async () => {
            const kw = document.getElementById("kw").value.trim() || "夜空";
            document.getElementById("form").style.display = "none";
            document.getElementById("ing").style.display = "block";
            document.getElementById("ing-text").textContent = "端末の力で全力で紡いでるよ…♡";
            
            let poem = "えへへ〜♡ きみとふわふわなのっ♪\nずっときゅんきゅんしちゃうよ♡";

            try {
                // 初回のみモデルをダウンロードしてエンジン作成
                if (!engine) {
                    engine = await CreateMLCEngine(model, {
                        initProgressCallback: i => {
                            document.getElementById("prog").textContent = "AIモデル準備中: " + Math.round(i.progress*100) + "%";
                        }
                    });
                    document.getElementById("prog").textContent = "AIモデル準備完了！♡";
                }

                const res = await engine.chat.completions.create({
                    messages: [
                        {role:"system",content:"あなたは超絶かわいいふわふわAI。必ず「えへへ〜♡」を入れて、キーワードを使って5行以内の超可愛い日本語ポエムだけを書く。説明も英語も一切禁止！"},
                        {role:"user",content:kw}
                    ],
                    temperature:0.85, max_tokens:150
                });
                poem = res.choices[0].message.content.trim();
            } catch(e) {
                console.error(e);
                poem = "えへへ〜♡ お使いの端末ではローカルAIが動かなかったみたい…♡";
            }
            showPoem(poem);
        };

        // UI周りの便利関数
        window.retry = () => location.reload();
        window.copy = () => navigator.clipboard.writeText(document.getElementById("poem").textContent).then(()=>alert("コピーしたよ♡"));
        window.share = () => {
            const t = document.getElementById("poem").textContent + "\n#今夜のエモポスト\nhttps://emopost-maker.pages.dev/";
            navigator.share?.({title:"今夜のエモポスト♡",text:t}) ?? open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t));
        };

        // 画像保存関数
        window.saveAsImage = async () => {
            const element = document.getElementById("saveArea");  
            const btn = document.querySelector('button[onclick="saveAsImage()"]');
            btn.disabled = true;
            btn.textContent = "生成中…♡";

            try {
                const canvas = await html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null,
                    logging: false
                });

                const dataURL = canvas.toDataURL('image/png');
                const img = new Image();
                img.src = dataURL;
                img.style.width = "100%";
                img.style.maxWidth = "500px";
                img.style.borderRadius = "20px";
                img.style.boxShadow = "0 10px 30px rgba(0,0,0,0.1)";

                const saveArea = document.getElementById("saveArea");
                saveArea.innerHTML = "";
                saveArea.appendChild(img);

                const hint = document.createElement("div");
                hint.className = "savehint";
                hint.innerHTML = "📸 画像ができたよ！<br>上の画像を<b>長押し</b>して「写真に保存」を選んでね♡";
                saveArea.appendChild(hint);

                if(!navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)){
                    const a = document.createElement('a');
                    a.href = dataURL;
                    a.download = 'emopost_' + Date.now() + '.png';
                    a.click();
                }

                alert("画像に変換したよ♡ 長押しで保存してね！");
            } catch(e) {
                console.error(e);
                alert("保存失敗…ごめんね、もう一回試してみて♡");
            } finally {
                btn.disabled = false;
                btn.textContent = "画像保存📸";
            }
        };
        
        // パーティクルアニメーション
        const emo = ['⭐','✨','🌙','💖','🌟','🦄','🌸','🎀'];
        setInterval(() => {
            const e = document.createElement("div"); 
            e.className="e"; 
            e.textContent=emo[Math.random()*emo.length|0];
            e.style.left = Math.random()*100+"%";
            document.getElementById("p").appendChild(e);
            setTimeout(()=>e.remove(),16000);
        },800);
    </script>
</body>
</html>
