    <style>
        body {
            font-family: "Hiragino Kaku Gothic ProN", sans-serif;
            background: linear-gradient(270deg, #e6f3ff, #f0e6ff, #ffe6f8);
            background-size: 600% 600%;
            animation: starryBG 25s ease infinite;
            text-align: center;
            padding: 2em;
            color: #555;
            position: relative;
            margin: 0;
        }

        @keyframes starryBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 絵文字パーティクル */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            font-size: 1.5em;
        }

        .emoji {
            position: absolute;
            animation: float 10s linear infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        h1 {
            font-family: "Kirang Haerang", cursive, "Hiragino Kaku Gothic ProN", sans-serif;
            font-size: 2.5em;
            background-color: #ffffff;
            padding: 0.5em 1em;
            border: 4px dotted #c0c0ff;
            border-radius: 1.5em;
            display: inline-block;
            box-shadow: 0 4px 10px #e6e6fa;
        }

        .gradient-text {
            background: linear-gradient(45deg, #87ceeb, #dda0dd, #ffb6c1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px #f0e6ff;
        }

        form, #resultArea {
            max-width: 500px;
            margin: 2em auto;
            background: #ffffffcc;
            border-radius: 1em;
            padding: 2em;
            box-shadow: 0 0 10px #b0c4de;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 0.2em;
            font-weight: bold;
            color: #6a5acd;
            text-shadow: 1px 1px 0 #fff;
            font-size: 1.05em;
        }

        input {
            font-family: "Hiragino Kaku Gothic ProN", sans-serif;
            border: 2px solid #c0c0ff;
            border-radius: 1em;
            padding: 0.5em 1em;
            font-size: 1em;
            box-shadow: 0 0 8px #e6e6fa;
            transition: all 0.3s ease-in-out;
            width: 100%;
            box-sizing: border-box;
            background-color: #f8f8ff;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px #b0c4de;
            border-color: #9370db;
        }

        .cute-button {
            background: linear-gradient(to right, #e6e6fa, #dda0dd);
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
            padding: 0.8em 1.5em;
            border-radius: 2em;
            cursor: pointer;
            transition: 0.3s;
            margin: 0.5em;
            box-shadow: 0 4px 6px #ccc;
        }

        .cute-button:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #d8bfd8, #c0c0ff);
        }

        #resultArea {
            background: #f0f8ff;
            border: 2px dashed #b0c4de;
            border-radius: 1.5em;
            padding: 2em;
            box-shadow: 0 4px 12px #e6e6fa;
            color: #4b0082;
            font-size: 1.1em;
            line-height: 1.8;
            display: none;
            position: relative;
        }

        #resultArea h2 {
            font-size: 1.5em;
            color: #6a5acd;
            margin-bottom: 1em;
        }

        .copy-icon {
            position: absolute;
            top: 1em;
            right: 1em;
            font-size: 1.2em;
            cursor: pointer;
            color: #9370db;
        }

        .copy-icon:hover {
            color: #6a5acd;
        }

        #loading {
            display: none;
            margin-top: 2em;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #dda0dd;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 1em auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #retryButtons {
            display: none;
            text-align: center;
            margin-top: 1.5em;
        }

        #buttonRow {
            display: flex;
            justify-content: center;
            gap: 1em;
            margin-top: 1em;
            flex-wrap: wrap;
        }

        #longpressSaveArea {
            text-align: center;
            margin-top: 1em;
        }

        @media screen and (max-width: 600px) {
            h1 { font-size: 1.8em; padding: 0.4em 0.8em; }
            form, #resultArea { padding: 1em; max-width: 100%; width: 100%; }
            .cute-button { font-size: 0.95em; padding: 0.6em 1em; margin: 0.4em; }
            #buttonRow { flex-direction: column; gap: 0.6em; }
            .copy-icon { font-size: 1em; top: 0.8em; right: 0.8em; }
        }

</head>
<body>
    <div class="particles" id="particles"></div>

    <h1><span class="gradient-text">今夜のエモポストメーカー 🌙✨</span></h1>

    <p style="text-align: center; font-weight: normal; color: #708090; font-size: 1em; margin-bottom: 1.2em; line-height: 1.6;">
        今日の気分やキーワードを入れてね。AIが夢のようなポエムを生成するよ〜✨<br>
        <span style="color: #9370db;">※初回は8秒くらい待ってね♪</span>
    </p>

    <form id="emopostForm">
        <label for="keyword">今日の気分やキーワード</label>
        <input type="text" id="keyword" name="keyword" placeholder="例: 幸せ、疲れた、ドキドキ" required>
        <button type="submit" class="cute-button" id="generateBtn">ポエム生成！</button>
    </form>

    <div id="loading">
        <div class="spinner"></div>
        <p>夢ポエムを紡いでる…</p>
    </div>

    <div id="resultArea">
        <span class="copy-icon" onclick="copyPoem()" title="ポエムをコピー">📋</span>
    </div>

    <div id="retryButtons">
        <button class="cute-button" onclick="retry()">もう一度生成！</button>
        <div id="buttonRow">
            <button id="saveImage" class="cute-button" onclick="saveImage()">画像を保存する</button>
            <button class="cute-button" onclick="sharePoem()">共有する</button>
        </div>
        <div id="longpressSaveArea"></div>
    </div>

    <footer style="text-align: center; margin evaluator-top: 3em; background-color: #f0f8ff; padding: 1em; border-top: 2px dashed #b0c4de;">
        <p style="font-weight: bold; color: #6a5acd; margin-bottom: 0.5em;">
            ポエム生成の後は…おせち気分で癒しグッズ♪（早割・特典付きも！）
        </p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 1em;">
            <a href="https://event.rakuten.co.jp/toshikoshi/" target="_blank" rel="nofollow sponsored noopener" style="text-decoration: none; color: #6a5acd; font-weight: bold;">
                🎍 楽天おせち特集2026 🎍<br>最大350円OFFクーポン！
            </a>
            <a href="https://hb.afl.rakuten.co.jp/hsc/4e336792.7c0b3872.3d95c766.8a7897b5/?link_type=pict&ut=eyJwYWdlIjoic2hvcCIsInR5cGUiOiJwaWN0IiwiY29sIjoxLCJjYXQiOiI1OCIsImJhbiI6MzIzMDk1MCwiYW1wIjpmYWxzZX0%3D" target="_blank" rel="nofollow sponsored noopener">
                <img src="https://hbb.afl.rakuten.co.jp/hsb/4e336792.7c0b3872.3d95c766.8a7897b5/?me_id=1&me_adv_id=3230950&t=pict" style="max-width: 150px; height: auto; border-radius: 0.5em; box-shadow: 0 2px 5px #ccc;" alt="癒しグッズ">
            </a>
        </div>
        <div class="back-to-home">
            <p style="margin-top: 2em;">
                <a href="https://mofu-mitsu.github.io/" style="text-decoration: none; font-weight: bold; color: #6a5acd;">TOPへ戻る</a>
            </p>
        </div>
    </footer>

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        env.allowRemoteModels = true;
        env.allowLocalModels = false;

        let generator;

        async function loadModel() {
            if (!generator) {
                generator = await pipeline('text-generation', 'Xenova/distilgpt2');
            }
        }
        loadModel();

        window.generatePoemWithAI = async function(keyword) {
            if (!generator) throw new Error('モデル未ロード');
            const prompt = `Write a dreamy short emotional poem in Japanese using the keyword "${keyword}". Keep it under 5 lines, poetic. Example: Under the moonlight...`;
            const output = await generator(prompt, { 
                max_new_tokens: 60, 
                temperature: 0.9, 
                do_sample: true,
                repetition_penalty: 1.2,
                pad_token_id: 50256
            });
            let poem = output[0].generated_text.replace(prompt, '').trim();
            // 英語混じり除去&日本語確保
            poem = poem.replace(/^[^\u3000-\u9FFF]+/g, '').trim();
            return poem || '夢のようなポエムが浮かばなかったよ…もう一度！';
        };

        function createEmojis() {
            const container = document.getElementById('particles');
            const emojis = ['⭐', '✨', '🌙', '💖', '🌟', '🦄', '🌸', '🎀'];
            setInterval(() => {
                const emoji = document.createElement('div');
                emoji.className = 'emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = Math.random() * 100 + '%';
                emoji.style.animationDuration = (Math.random() * 8 + 8) + 's';
                container.appendChild(emoji);
                setTimeout(() => emoji.remove(), 16000);
            }, 800);
        }
        createEmojis();

        window.retry = function() {
            document.getElementById("emopostForm").reset();
            document.getElementById("emopostForm").style.display = "block";
            document.getElementById("resultArea").style.display = "none";
            document.getElementById("retryButtons").style.display = "none";
            document.getElementById("longpressSaveArea").innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.copyPoem = function() {
            const poem = document.getElementById("resultArea").querySelector('p').innerText.trim();
            navigator.clipboard.writeText(poem).then(() => {
                alert('ポエムをコピーしたよ！');
            }).catch(() => {
                alert('コピー失敗…');
            });
        };

        window.sharePoem = function() {
            const result = document.getElementById("resultArea").querySelector('p').innerText.trim();
            const text = result + "\n#今夜のエモポスト\n" + window.location.href;
            if (navigator.share) {
                navigator.share({ 
                    title: '今夜のエモポストメーカー', 
                    text: text 
                }).catch(() => alert('共有キャンセル'));
            } else {
                // フォールバックでXポスト
                const encodedText = encodeURIComponent(result + "\n#今夜のエモポスト");
                const url = encodeURIComponent(window.location.href);
                window.open(`https://twitter.com/intent/tweet?text=${encodedText}&url=${url}`, "_blank");
            }
        };

        window.saveImage = function() {
            const target = document.getElementById('resultArea');
            html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'emo_poem.png';
                link.href = canvas.toDataURL('image/png');
                if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    link.click();
                } else {
                    const imgArea = document.getElementById('longpressSaveArea');
                    imgArea.innerHTML = '';
                    const img = new Image();
                    img.src = canvas.toDataURL('image/png');
                    img.style.maxWidth = '100%';
                    img.style.border = '2px solid #dda0dd';
                    img.style.borderRadius = '1em';
                    imgArea.appendChild(img);
                    const note = document.createElement('p');
                    note.textContent = '※長押しして保存してね♪';
                    note.style.color = '#6a5acd';
                    note.style.fontWeight = 'bold';
                    imgArea.appendChild(note);
                }
            }).catch(() => alert('画像保存失敗…'));
        };

        document.getElementById("emopostForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const keyword = this.keyword.value.trim();
            if (!keyword) return alert('キーワード入れてね〜！');

            document.getElementById("emopostForm").style.display = "none";
            document.getElementById("loading").style.display = "block";

            try {
                const poem = await window.generatePoemWithAI(keyword);
                document.getElementById("loading").style.display = "none";
                document.getElementById("resultArea").style.display = "block";
                document.getElementById("resultArea").innerHTML = `
                    <span class="copy-icon" onclick="copyPoem()" title="ポエムをコピー">📋</span>
                    <h2>🌙あなたの夢ポエム🌙</h2>
                    <p>${poem}</p>
                `;
                document.getElementById("retryButtons").style.display = "block";
            } catch (error) {
                console.error(error);
                alert('生成失敗…リロードしてね！');
                document.getElementById("loading").style.display = "none";
                document.getElementById("emopostForm").style.display = "block";
            }
        });
    </script>
</body>
</html>
