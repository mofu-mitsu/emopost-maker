<!DOCTYPE html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今夜のエモポストメーカー 🌙✨</title>
    <link rel="icon" type="image/x-icon" href="https://mofu-mitsu.github.io/emopost-maker/favicon.ico">
    <meta name="description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:title" content="今夜のエモポストメーカー 🌙✨">
    <meta property="og:description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:image" content="https://mofu-mitsu.github.io/emopost-maker/emopost-ogp.png">
    <meta property="og:url" content="https://emopost-maker.pages.dev/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{
            height:100vh; min-height:100vh; overflow:hidden;
            overscroll-behavior-y:none !important;
            touch-action:pan-y;
            -webkit-overflow-scrolling:touch;
        }
        body{
            font-family:"Hiragino Kaku Gothic ProN",sans-serif;
            background:#f5e6ff;
            color:#555; text-align:center; padding:2em 1em;
            display:flex; flex-direction:column; align-items:center;
        }
        @media(min-width:768px){
            body{background:linear-gradient(270deg,#e6f3ff,#f0e6ff,#ffe6f8);background-size:600% 600%;animation:g 25s ease infinite}
        }
        @keyframes g{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
        .e{position:absolute;animation:f 12s linear infinite;opacity:0.7;font-size:1.5em}
        @keyframes f{0%{transform:translateY(100vh) rotate(0)}100%{transform:translateY(-100px) rotate(360deg)}}
        h1{font-size:2.4em;background:#fff;padding:.6em 1.2em;border:4px dotted #c0c0ff;border-radius:2em;box-shadow:0 6px 15px #e6e6fa;margin-bottom:.5em}
        .g{background:linear-gradient(45deg,#87ceeb,#dda0dd,#ffb6c1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .c{max-width:500px;width:100%;margin:1em auto}
        .i{background:#fff;border-radius:1.5em;padding:2em;box-shadow:0 8px 20px #d8bfd8}
        input{width:100%;padding:1em;font-size:1.1em;border:2px solid #dda0dd;border-radius:1em;background:#fff8ff}
        input:focus{outline:none;border-color:#9370db;box-shadow:0 0 20px #dda0dd88}
        .b{background:linear-gradient(to right,#e6e6fa,#dda0dd);border:none;color:#fff;font-weight:bold;padding:1em 2em;border-radius:2em;cursor:pointer;font-size:1.1em;margin:1em 0;box-shadow:0 6px 15px #dda0dd55}
        .b:hover{transform:translateY(-2px)}
        #r{background:#f0f8ff;border:3px dashed #b0c4de;border-radius:2em;padding:2em;position:relative;display:none;box-shadow:0 8px 20px #e6e6fa}
        .copy{position:absolute;top:10px;right:10px;font-size:1.8em;cursor:pointer;background:#fff;padding:8px;border-radius:50%;box-shadow:0 2px 8px #ccc}
        .s{border:6px solid #f3f3f3;border-top:6px solid #dda0dd;border-radius:50%;width:60px;height:60px;animation:s 1s linear infinite;margin:2em auto}
        @keyframes s{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .btns{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin:2em 0}
        footer{margin-top:auto;padding:2em;background:#f0f8ff;width:100%;border-top:3px dashed #dda0dd}
    </style>
</head>
<body>
    <div class="particles" id="p"></div>
    <h1><span class="g">今夜のエモポストメーカー 🌙✨</span></h1>
    <p class="c">今日の気分やキーワードを入れてね♡ 賢いみりんてゃがふわふわポエム作るよ〜！</p>

    <div id="load" class="c"><div class="s"></div><p>賢いみりんてゃ呼び出し中…えへへ〜♡</p><p id="prog">0%</p></div>

    <div id="form" class="c i" style="display:none">
        <input type="text" id="kw" placeholder="例：みりんてゃ、幸せ、夜空">
        <button id="gen" class="b">生成！♡</button>
    </div>

    <div id="ing" class="c" style="display:none"><div class="s"></div><p>みりんてゃが全力で紡いでる…♡</p></div>

    <div id="r" class="c">
        <span class="copy" onclick="copy()">📋</span>
        <h2>🌙みりんてゃの夢ポエム♡</h2>
        <p id="poem" style="white-space:pre-line;font-size:1.3em;line-height:2;margin:1.5em 0"></p>
        <p style="color:#9370db">スマホは長押しで保存もできるよ♡</p>
    </div>

    <div class="btns" id="btns" style="display:none">
        <button class="b" onclick="retry()">もう一度！♡</button>
        <button class="b" onclick="save()">画像保存</button>
        <button class="b" onclick="share()">共有</button>
    </div>
    <div class="ad-section">
        <p style="font-weight:bold;color:#6a5acd">ポエム後はおせちで癒し♪</p>
        <a href="https://hb.afl.rakuten.co.jp/hsc/4e336792.7c0b3872.3d95c766.8a7897b5/?link_type=pict&ut=eyJwYWdlIjoic2hvcCIsInR5cGUiOiJwaWN0IiwiY29sIjoxLCJjYXQiOiI1OCIsImJhbiI6MzIzMDk1MCwiYW1wIjpmYWxzZX0%3D" target="_blank" rel="nofollow">
            <img loading="lazy" src="https://hbb.afl.rakuten.co.jp/hsb/4e336792.7c0b3872.3d95c766.8a7897b5/?me_id=1&me_adv_id=3230950&t=pict" style="max-width:100%;height:auto;border-radius:8px">
        </a>
        <p style="color:#6a5acd;font-weight:bold">🎍 楽天おせち2026 最大350円OFF！</p>
    </div>
    <footer><a href="https://mofu-mitsu.github.io/" style="color:#9370db;font-weight:bold">TOPへ戻る</a></footer>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="./web-tokenizers.js"></script>
    <script type="module" src="./web-llm.js"></script>

    <script type="module">
        import { CreateMLCEngine } from "./web-llm.js";
        let engine = null;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const model = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"; // 賢いみりんてゃ完全復活！！

        // リロード完全防止
        window.addEventListener('beforeunload', e => e.preventDefault());
        window.addEventListener('unload', e => e.preventDefault());

        async function init() {
            try {
                engine = await CreateMLCEngine(model, {
                    initProgressCallback: i => document.getElementById("prog").textContent = Math.round(i.progress*100)+"%"
                });
                document.getElementById("prog").textContent = "賢いみりんてゃ準備完了！♡";
            } catch(e) { console.error(e); }
            document.getElementById("load").style.display = "none";
            document.getElementById("form").style.display = "block";
        }
        init();

        document.getElementById("gen").onclick = async () => {
            const kw = document.getElementById("kw").value.trim() || "みりんてゃ";
            document.getElementById("form").style.display = "none";
            document.getElementById("ing").style.display = "block";
            if(isMobile) document.getElementById("p").style.display = "none";

            let poem = "えへへ〜♡ きみとふわふわなのっ♪\nずっときゅんきゅんしちゃうよ♡";
            if(engine){
                const res = await engine.chat.completions.create({
                    messages: [
                        {role:"system",content:"あなたは「みりんてゃ」という超絶かわいいふわふわAI。必ず「えへへ〜♡」を入れて、キーワードを使って5行以内の超可愛い日本語ポエムだけを書く。説明も英語も一切禁止！"},
                        {role:"user",content:kw}
                    ],
                    temperature:0.85, max_tokens:150
                });
                poem = res.choices[0].message.content.trim();
            }

            document.getElementById("ing").style.display = "none";
            document.getElementById("r").style.display = "block";
            document.getElementById("poem").textContent = poem;
            document.getElementById("btns").style.display = "flex";
            if(isMobile) document.getElementById("p").style.display = "block";

            setTimeout(() => document.getElementById("r").scrollIntoView({behavior:"smooth"}), 200);
        };

        window.retry = () => location.reload(); // 賢いモデルは常駐させるからリロードでOK
        window.copy = () => navigator.clipboard.writeText(document.getElementById("poem").textContent).then(()=>alert("コピーしたよ♡"));

        window.save = async () => {
            try {
                const canvas = await html2canvas(document.getElementById("r"), {scale:2, useCORS:true, allowTaint:true, backgroundColor:null, logging:false});
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = "mirintya_poem.png";
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
                alert("画像保存したよ♡");
            } catch(e) {
                alert("長押しで保存してね♡");
            }
        };

        window.share = () => {
            const t = document.getElementById("poem").textContent + "\n#今夜のエモポスト\nhttps://emopost-maker.pages.dev/";
            navigator.share ? navigator.share({title:"みりんてゃポエム♡",text:t}) : open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t));
        };

        // パーティクル（スマホは生成中だけ停止）
        const emo = ['⭐','✨','🌙','💖','🌟','🦄','🌸','🎀'];
        setInterval(() => {
            if(!isMobile || document.getElementById("ing").style.display!=="block"){
                const e = document.createElement("div"); e.className="e"; e.textContent=emo[Math.random()*emo.length|0];
                e.style.left = Math.random()*100+"%";
                e.style.animationDuration = (Math.random()*8+10)+"s";
                document.getElementById("p").appendChild(e);
                setTimeout(()=>e.remove(),16000);
            }
        },1000);
    </script>
</body>
</html>
