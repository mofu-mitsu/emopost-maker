<!DOCTYPE html>
<html lang="ja">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今夜のエモポストメーカー 🌙✨</title>
    <link rel="icon" type="image/x-icon" href="https://mofu-mitsu.github.io/emopost-maker/favicon.ico">
    <meta name="description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:title" content="今夜のエモポストメーカー 🌙✨">
    <meta property="og:description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もできるよ♪">
    <meta property="og:image" content="https://mofu-mitsu.github.io/emopost-maker/emopost-ogp.png">
    <meta property="og:url" content="https://emopost-maker.pages.dev/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100vh;overflow:hidden;overscroll-behavior-y:none !important;}
        body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#f5e6ff;color:#555;text-align:center;padding:2em;display:flex;flex-direction:column;align-items:center;}
        @media(min-width:768px){body{background:linear-gradient(270deg,#e6f3ff,#f0e6ff,#ffe6f8);background-size:600% 600%;animation:g 25s ease infinite}}
        @keyframes g{0%{background-position:0%50%}50%{background-position:100%50%}100%{background-position:0%50%}}
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
        .e{position:absolute;animation:f 12s linear infinite;opacity:0.7;font-size:1.5em}
        @keyframes f{0%{transform:translateY(100vh)}100%{transform:translateY(-100px)}}
        h1{font-size:2.4em;background:#fff;padding:.6em 1.2em;border:4px dotted #c0c0ff;border-radius:2em;box-shadow:0 6px 15px #e6e6fa}
        .g{background:linear-gradient(45deg,#87ceeb,#dda0dd,#ffb6c1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .c{max-width:500px;width:100%;margin:1em auto}
        .i{background:#fff;border-radius:1.5em;padding:2em;box-shadow:0 8px 20px #d8bfd8}
        input{width:100%;padding:1em;font-size:1.1em;border:2px solid #dda0dd;border-radius:1em;background:#fff8ff}
        .b{background:linear-gradient(to right,#e6e6fa,#dda0dd);border:none;color:#fff;font-weight:bold;padding:1em 2em;border-radius:2em;cursor:pointer;font-size:1.1em;margin:1em 0;box-shadow:0 6px 15px #dda0dd55}
        #r{background:#f0f8ff;border:3px dashed #b0c4de;border-radius:2em;padding:2em;position:relative;box-shadow:0 8px 20px #e6e6fa}
        .copy{position:absolute;top:10px;right:10px;font-size:1.8em;cursor:pointer;background:#fff;padding:8px;border-radius:50%}
        .s{border:6px solid #f3f3f3;border-top:6px solid #dda0dd;border-radius:50%;width:60px;height:60px;animation:s 1s linear infinite;margin:2em auto}
        @keyframes s{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .btns{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin:2em 0}
        .savehint{background:#fff8ff;padding:1.5em;border-radius:2em;margin:2em 0;box-shadow:0 8px 25px #dda0dd55;color:#d670d6;font-weight:bold}
        footer{margin-top:auto;padding:2em;background:#f0f8ff;width:100%;border-top:3px dashed #dda0dd}
    </style>
</head>
<body>
    <div class="particles" id="p"></div>
    <h1><span class="g">今夜のエモポストメーカー 🌙✨</span></h1>
    <p class="c">今日の気分やキーワードを入れてね♡ 賢いみりんてゃがふわふわポエム作るよ〜！</p>

    <div id="load" class="c"><div class="s"></div><p>賢いみりんてゃ呼び出し中…えへへ〜♡</p><p id="prog">0%</p></div>
    <div id="form" class="c i" style="display:none">
        <input type="text" id="kw" placeholder="例：みりんてゃ、幸せ、夜空">
        <button id="gen" class="b">生成！♡</button>
    </div>
    <div id="ing" class="c" style="display:none"><div class="s"></div><p>みりんてゃが全力で紡いでる…♡</p></div>

    <div id="r" class="c" style="display:none">
        <span class="copy" onclick="copy()">📋</span>
        <h2>🌙みりんてゃの夢ポエム♡</h2>
        <p id="poem" style="white-space:pre-line;font-size:1.35em;line-height:2.2;margin:2em 0;padding:2em;background:rgba(255,255,255,0.8);border-radius:2em"></p>
        <div class="savehint">
            💡 スマホの方はここを長押し → 「写真に保存」で完璧に保存できるよ♡<br>
            <small>（一番確実でリロードもしない最強の方法！）</small>
        </div>
    </div>

    <div class="btns" id="btns" style="display:none">
        <button class="b" onclick="retry()">もう一度！♡</button>
        <button class="b" onclick="share()">共有</button>
    </div>

    <footer><a href="https://mofu-mitsu.github.io/" style="color:#9370db;font-weight:bold">TOPへ戻る</a></footer>

<script type="module">
    import { CreateMLCEngine } from "./web-llm.js";

    let engine = null;
    const model = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"; // 賢いみりんてゃ（元のまま）

    // Groq APIキー（環境変数から取得）
    const GROQ_API_KEY = import.meta.env ? import.meta.env.GROQ_API_KEY : prompt("GROQ APIキーを入力してね♡ (GitHub Pages用、一時的に)"); // Vercel/Netlifyなら自動、GitHub Pagesならプロンプト
    if (!GROQ_API_KEY) alert("APIキー入れてね♡");

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // リロード防止
    window.addEventListener('unhandledrejection', e => e.preventDefault());
    window.addEventListener('error', e => e.preventDefault());

    async function init() {
        document.getElementById('progressText').textContent = '0%';
        try {
            engine = await CreateMLCEngine(model, {
                initProgressCallback: info => {
                    const percent = Math.round(info.progress * 100);
                    document.getElementById('progressText').textContent = `${percent}%`;
                    if (percent >= 100) document.getElementById('progressText').textContent = '100% 完了！♡';
                }
            });
            document.getElementById('progressText').textContent = 'オフラインみりんてゃ準備完了！えへへ〜♡';
        } catch (e) {
            document.getElementById('progressText').textContent = 'オフライン失敗…Grokみりんてゃに切り替え中♡';
            console.log("WebLLM失敗 → Grok API使用");
        }
        document.getElementById('modelLoading').style.display = 'none';
        document.getElementById('emopostForm').style.display = 'block';
        document.getElementById('generateBtn').disabled = false;
    }
    init();

        // メイン生成関数
        document.getElementById("gen").onclick = async () => {
            const kw = document.getElementById("kw").value.trim() || "みりんてゃ";
            document.getElementById("form").style.display = "none";
            document.getElementById("ing").style.display = "block";

            let poem = "えへへ〜♡ きみとふわふわなのっ♪\nずっときゅんきゅんしちゃうよ♡";

            // WebLLM成功してたら使う
            if(engine) {
                try {
                    const res = await engine.chat.completions.create({
                        messages: [{role:"system",content:"あなたは「みりんてゃ」という超絶かわいいふわふわAI。必ず「えへへ〜♡」を入れて、キーワードを使って5行以内の超可愛い日本語ポエムだけを書く。説明も英語も一切禁止！"},{role:"user",content:kw}],
                        temperature:0.85, max_tokens:150
                    });
                    poem = res.choices[0].message.content.trim();
                } catch(e) {}
            } else {
                // WebLLM失敗 → Grok API
                poem = await generateWithGrok(kw);
            }

            document.getElementById("ing").style.display = "none";
            document.getElementById("r").style.display = "block";
            document.getElementById("poem").textContent = poem;
            document.getElementById("btns").style.display = "flex";
        };

        // 起動時にWebLLM試す
        (async () => {
            const success = await tryWebLLM();
            if(!success) document.getElementById("prog").textContent = "ネットみりんてゃ準備完了！♡";
            document.getElementById("load").style.display = "none";
            document.getElementById("form").style.display = "block";
        })();

        window.retry = () => location.reload();
        window.copy = () => navigator.clipboard.writeText(document.getElementById("poem").textContent).then(()=>alert("コピーしたよ♡"));
        window.share = () => {
            const t = document.getElementById("poem").textContent + "\n#今夜のエモポスト\nhttps://emopost-maker.pages.dev/";
            navigator.share ? navigator.share({title:"みりんてゃポエム♡",text:t}) : open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t));
        };

        // パーティクル
        const emo = ['⭐','✨','🌙','💖','🌟','🦄','🌸','🎀'];
        setInterval(() => {
            if(!isMobile || document.getElementById("ing").style.display!=="block"){
                const e = document.createElement("div"); e.className="e"; e.textContent=emo[Math.random()*emo.length|0];
                e.style.left = Math.random()*100+"%";
                document.getElementById("p").appendChild(e);
                setTimeout(()=>e.remove(),16000);
            }
        },1000);
    </script>
</body>
</html>
