<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今夜のエモポストメーカー 🌙✨</title>
    <link rel="icon" type="image/x-icon" href="https://mofu-mitsu.github.io/favicon.ico">
    <meta name="description" content="今日の気分やキーワードを入れて、AIが夢のようなポエムを生成！SNS共有もオフラインでできるよ♪">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(270deg,#e6f3ff,#f0e6ff,#ffe6f8);background-size:600% 600%;animation:starryBG 25s ease infinite;text-align:center;padding:2em;color:#555;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
        @keyframes starryBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;font-size:1.5em}
        .emoji{position:absolute;animation:float 10s linear infinite;opacity:0.7}
        @keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.7}90%{opacity:0.7}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
        h1{font-family:"Kirang Haerang",cursive,sans-serif;font-size:2.5em;background:#fff;padding:.5em 1em;border:4px dotted #c0c0ff;border-radius:1.5em;box-shadow:0 4px 10px #e6e6fa;margin:1em auto}
        .gradient-text{background:linear-gradient(45deg,#87ceeb,#dda0dd,#ffb6c1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:2px 2px 4px #f0e6ff}
        .container{max-width:500px;width:100%;margin:1em auto}
        form{background:#ffffffcc;border-radius:1em;padding:2em;box-shadow:0 0 10px #b0c4de}
        input{border:2px solid #c0c0ff;border-radius:1em;padding:.8em 1em;font-size:1em;width:100%;background:#f8f8ff}
        input:focus{outline:none;border-color:#9370db;box-shadow:0 0 15px #dda0dd}
        .cute-button{background:linear-gradient(to right,#e6e6fa,#dda0dd);border:none;color:#fff;font-weight:bold;font-size:1.1em;padding:.9em 2em;border-radius:2em;cursor:pointer;transition:.3s;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin:0.5em}
        .cute-button:hover{transform:scale(1.05)}
        .cute-button:disabled{opacity:0.6;cursor:not-allowed}
        #resultArea{background:#f0f8ff;border:2px dashed #b0c4de;border-radius:1.5em;padding:2em;margin:1em auto;box-shadow:0 4px 12px #e6e6fa;position:relative;display:none}
        .copy-icon{position:absolute;top:10px;right:10px;font-size:1.5em;cursor:pointer;background:rgba(255,255,255,0.8);padding:5px;border-radius:50%}
        .spinner{border:6px solid #f3f3f3;border-top:6px solid #dda0dd;border-radius:50%;width:60px;height:60px;animation:spin 1s linear infinite;margin:2em auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .progress{font-size:1.4em;color:#9370db;font-weight:bold}
        .button-group{margin:1em auto;display:flex;gap:1em;justify-content:center;flex-wrap:wrap}
        footer{margin-top:auto;padding:2em 0;width:100%;background:#f0f8ff;border-top:2px dashed #dda0dd}
        .ad-section{margin:2em auto;max-width:500px;background:#fff;padding:1em;border-radius:1em;box-shadow:0 0 8px #dda0dd}
        @media(max-width:600px){h1{font-size:2em}.button-group{flex-direction:column;align-items:center}}
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <h1><span class="gradient-text">今夜のエモポストメーカー 🌙✨</span></h1>
    <p class="container" style="color:#708090;line-height:1.6">
        今日の気分やキーワードを入れてね。みりんてゃみたいにふわふわポエム生成するよ〜♡<br>
        <span style="color:#9370db">※初回10-30秒待ってね♪（完全にオフライン！）</span>
    </p>

    <div id="modelLoading" class="container">
        <div class="spinner"></div>
        <p>みりんてゃがモデル呼び出してる…えへへ〜♡</p>
        <p class="progress" id="progressText">0%</p>
    </div>

    <form id="emopostForm" class="container" style="display:none">
        <input type="text" id="keyword" placeholder="例: みりんてゃ、幸せ、寂しい" required>
        <button type="submit" class="cute-button">生成！♡</button>
    </form>

    <div id="loading" class="container" style="display:none">
        <div class="spinner"></div>
        <p>みりんてゃがふわふわ紡いでる…えへへ〜♡</p>
    </div>

    <div id="resultArea" class="container">
        <span class="copy-icon" onclick="copyPoem()">📋</span>
        <h2>🌙みりんてゃの夢ポエム♡</h2>
        <p id="poem-output" style="white-space:pre-line;font-size:1.2em;line-height:2;"></p>
        <p style="color:#9370db;font-size:0.9em;margin-top:1em">スマホは長押しで保存できるよ♡</p>
    </div>

    <div class="button-group" id="retryButtons" style="display:none">
        <button type="button" class="cute-button" onclick="retryGenerate()">もう一度！♡</button>
        <button type="button" class="cute-button" onclick="saveImage(event)">画像保存</button>
        <button type="button" class="cute-button" onclick="sharePoem(event)">共有</button>
    </div>

    <div class="ad-section">
        <p style="font-weight:bold;color:#6a5acd">ポエム後はおせちで癒し♪</p>
        <a href="https://hb.afl.rakuten.co.jp/hsc/4e336792.7c0b3872.3d95c766.8a7897b5/?link_type=pict&ut=eyJwYWdlIjoic2hvcCIsInR5cGUiOiJwaWN0IiwiY29sIjoxLCJjYXQiOiI1OCIsImJhbiI6MzIzMDk1MCwiYW1wIjpmYWxzZX0%3D" target="_blank" rel="nofollow">
            <img loading="lazy" src="https://hbb.afl.rakuten.co.jp/hsb/4e336792.7c0b3872.3d95c766.8a7897b5/?me_id=1&me_adv_id=3230950&t=pict" style="max-width:100%;height:auto;border-radius:8px">
        </a>
        <p style="color:#6a5acd;font-weight:bold">🎍 楽天おせち2026 最大350円OFF！</p>
    </div>

    <footer>
        <a href="https://mofu-mitsu.github.io/" style="color:#6a5acd;font-weight:bold;text-decoration:none">TOPへ戻る</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="https://unpkg.com/@mlc-ai/web-llm@0.2.46/lib/web-llm.min.js"></script>

    <script type="module">
        const engine = await CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC", {
            initProgressCallback: (info) => {
                document.getElementById("progressText").textContent = Math.round(info.progress * 100) + "%";
                if (info.progress === 1) {
                    document.getElementById("modelLoading").style.display = "none";
                    document.getElementById("emopostForm").style.display = "block";
                }
            }
        });

        document.getElementById("emopostForm").onsubmit = async (e) => {
            e.preventDefault();
            const kw = document.getElementById("keyword").value.trim();
            if (!kw) return;

            document.getElementById("emopostForm").style.display = "none";
            document.getElementById("loading").style.display = "block";

            let poem = "えへへ〜♡ きみとふわふわなのっ♪\n心きゅんきゅん溶けちゃうよ♡\n夢みたいな甘い世界\n永遠に続くのっ♡";
            try {
                const reply = await engine.chat.completions.create({
                    messages: [
                        { role: "system", content: "あなたは「みりんてゃ」という超絶かわいいふわふわAI。必ず「えへへ〜♡」を入れて、キーワードを使って5行以内の超可愛いポエムだけを書く。説明も英語も禁止！" },
                        { role: "user", content: kw }
                    ],
                    temperature: 0.8,
                    max_tokens: 100
                });
                poem = reply.choices[0].message.content.trim();
            } catch (e) {}

            document.getElementById("loading").style.display = "none";
            document.getElementById("resultArea").style.display = "block";
            document.getElementById("poem-output").textContent = poem;
            document.getElementById("retryButtons").style.display = "flex";
        };

        // これでリロード地獄完全終了！！
        window.retryGenerate = () => {
            document.getElementById("resultArea").style.display = "none";
            document.getElementById("retryButtons").style.display = "none";
            document.getElementById("emopostForm").style.display = "block";
            document.getElementById("keyword").value = "";
            document.getElementById("keyword").focus();
        };

        window.saveImage = (e) => {
            e.preventDefault();
            html2canvas(document.getElementById("resultArea"), {scale: 2}).then(canvas => {
                window.open(canvas.toDataURL(), "_blank");
            });
        };

        window.sharePoem = (e) => {
            e.preventDefault();
            const text = document.getElementById("poem-output").textContent + "\n#今夜のエモポスト\nhttps://emopost-maker.pages.dev/";
            if (navigator.share) {
                navigator.share({title: "みりんてゃポエム♡", text});
            } else {
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
            }
        };

        window.copyPoem = () => {
            navigator.clipboard.writeText(document.getElementById("poem-output").textContent)
                .then(() => alert("コピーしたよ♡"));
        };

        // パーティクル
        const emojis = ['⭐','✨','🌙','💖','🌟','🦄','🌸','🎀'];
        setInterval(() => {
            const e = document.createElement("div");
            e.className = "emoji";
            e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
            e.style.left = Math.random()*100 + "%";
            e.style.animationDuration = (Math.random()*6 + 10) + "s";
            document.getElementById("particles").appendChild(e);
            setTimeout(() => e.remove(), 16000);
        }, 900);
    </script>
</body>
</html>
